services:
  mongodb:
    image: mongo:7.0.24-jammy
    restart: unless-stopped
    command: mongod --bind_ip_all --replSet rs0
    healthcheck:
      test: mongosh --quiet /scripts/replica-set.js
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30
    volumes:
      - ./repos/lila:/lila
      - ./scripts:/scripts
    profiles:
      - base

  mongodb_secondary:
    image: mongo:7.0.24-jammy
    restart: unless-stopped
    command: mongod --bind_ip_all --replSet rs0
    profiles:
      - base

  redis:
    image: redis:8.0.3-alpine3.21
    restart: unless-stopped
    profiles:
      - base

  chesstory:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: sbt.Dockerfile
    user: ${USER_ID:-}:${GROUP_ID:-}
    working_dir: /lila
    env_file:
      - ./settings.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ "$${CHESSTORY_RUNTIME:-dev}" = "prod" ]; then
          case "$${CHESSTORY_STAGE_ON_BOOT:-auto}" in
            always) ./lila.sh stage ;;
            auto) [ -x "$${CHESSTORY_STAGE_BIN:-/tmp/lila-target/lila/universal/stage/bin/lila}" ] || ./lila.sh stage ;;
            skip) ;;
            *) echo "Invalid CHESSTORY_STAGE_ON_BOOT=$${CHESSTORY_STAGE_ON_BOOT}. Use auto|always|skip." >&2; exit 1 ;;
          esac
          stage_bin="$${CHESSTORY_STAGE_BIN:-/tmp/lila-target/lila/universal/stage/bin/lila}"
          [ -x "$${stage_bin}" ] || stage_bin=/lila/target/universal/stage/bin/lila
          [ -x "$${stage_bin}" ] || { echo "Stage binary not found at configured paths." >&2; exit 1; }
          exec "$${stage_bin}" \
            -Dconfig.file="$${CHESSTORY_CONFIG_FILE:-/lila/conf/application.conf}" \
            -Dlogger.file="$${CHESSTORY_LOGGER_FILE:-/lila/conf/logger.dev.xml}"
        else
          exec ./lila.sh run
        fi
    restart: unless-stopped
    environment:
      - CHESSTORY_DOMAIN=${CHESSTORY_DOMAIN:-localhost:8080}
      - CHESSTORY_URL=${CHESSTORY_URL:-http://localhost:8080}
      - CHESSTORY_RUNTIME=${CHESSTORY_RUNTIME:-dev}
      - CHESSTORY_STAGE_ON_BOOT=${CHESSTORY_STAGE_ON_BOOT:-auto}
      - CHESSTORY_STAGE_BIN=${CHESSTORY_STAGE_BIN:-/tmp/lila-target/lila/universal/stage/bin/lila}
      - CHESSTORY_CONFIG_FILE=${CHESSTORY_CONFIG_FILE:-/lila/conf/application.conf}
      - CHESSTORY_LOGGER_FILE=${CHESSTORY_LOGGER_FILE:-/lila/conf/logger.dev.xml}
      - ENABLE_RATE_LIMITING=${ENABLE_RATE_LIMITING:-true}
    volumes:
      - ./repos/lila:/lila
      - ./repos/scalachess:/scalachess
      - ./conf/lila.conf:/lila/conf/application.conf
    profiles:
      - base

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      - CHESSTORY_DOMAIN=${CHESSTORY_DOMAIN:-localhost:8080}
      - CHESSTORY_URL=${CHESSTORY_URL:-http://localhost:8080}
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile
      - ./repos/lila/public:/lila/public
      - ./static:/static
    profiles:
      - base

  mono:
    build:
      context: .
      dockerfile: docker/mono.Dockerfile
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - CHESSTORY_DOMAIN=${CHESSTORY_DOMAIN:-localhost:8080}
      - CHESSTORY_URL=${CHESSTORY_URL:-http://localhost:8080}
    profiles:
      - quick

  python:
    build:
      context: docker
      dockerfile: python.Dockerfile
    volumes:
      - ./repos/lila-db-seed:/lila-db-seed
      - ./scripts:/scripts
    profiles:
      - utils

  ui:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: ui.Dockerfile
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    environment:
      - CI=1 # to disable pnpm install prompts
    volumes:
      - ./repos/lila:/lila
      - ./.pnpm-store:/.pnpm-store
    profiles:
      - utils

networks:
  default:
    name: chesstory-network
    driver: bridge
