[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chesstory-judgment-evaluation"
version = "0.3.0"
description = "External, stage-intervention evaluation harness for Chesstory judgment"
requires-python = ">=3.11"
dependencies = ["python-chess>=1.999,<2"]

[project.scripts]
judgment-eval = "chesstory_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
