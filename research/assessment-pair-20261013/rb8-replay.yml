            - button "Nd5 · 위치 살펴보기" [ref=e843] [cursor=pointer]: Nd5
            - text: "이후의 배치에서는: 원래 a8의 룩은 b8에 남습니다. 흑 b7 폰을 지킵니다. 원래 b3의 비숍은 교환되어 남지 않습니다. 원래 d4의 나이트는 교환되어 남지 않습니다. 원래 e5의 폰은 교환을 거쳐 c3에 남습니다. 앞쪽의 같은 파일과 옆 파일에 상대 폰이 없는 통과폰입니다. c7 폰과 같은 파일에 겹칩니다. 현재 흑 d5 나이트, 흑 g7 비숍이 지킵니다. 제시된"
            - button "Rb8 · 위치 살펴보기" [ref=e844] [cursor=pointer]: Rb8
            - text: 수순에서 양쪽이 나이트 한 개와 비숍 한 개씩 교환합니다.
