            - button "Rb8 · 위치 살펴보기" [ref=e832] [cursor=pointer]: Rb8
            - text: — 흑 b8 룩이 백 g2 비숍에게 공격받는 흑 b7 폰을 지킵니다.
            - button "Bd5 · 위치 살펴보기" [ref=e833] [cursor=pointer]: Bd5
            - text: — 원래 b3의 비숍을 옮겨 백 b1 퀸의 공격을 피합니다. 흑 d5 비숍이 백 g2 비숍에서 흑 b7 폰 쪽으로 이어지는 공격선을 막습니다. 백 g2 비숍을 새로 공격합니다. 아래는 엔진이 제시한 각 응수에서 남는 기능과 교환 비용입니다.
          - paragraph [ref=e834]:
            - text: 제시된 수순은
            - button "Rb8 · 위치 살펴보기" [ref=e835] [cursor=pointer]: Rb8
