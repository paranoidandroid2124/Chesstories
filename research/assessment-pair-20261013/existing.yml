          - paragraph [ref=e551]:
            - text: 평가에서 비교한 두 선택은
            - button "c6 · 위치 살펴보기" [ref=e552] [cursor=pointer]: c6
            - text: 와
            - button "Bd5 · 위치 살펴보기" [ref=e553] [cursor=pointer]: Bd5
            - text: 입니다.
            - button "c6 · 위치 살펴보기" [ref=e554] [cursor=pointer]: c6
            - text: — 흑 c6 폰이 백 g2 비숍에서 흑 b7 폰 쪽으로 이어지는 공격선을 막습니다. 백 b5 폰을 새로 공격합니다. 흑 c6 폰이 d5 진출을 받칩니다.
            - button "Bd5 · 위치 살펴보기" [ref=e555] [cursor=pointer]: Bd5
            - text: — 원래 b3의 비숍을 옮겨 백 b1 퀸의 공격을 피합니다. 흑 d5 비숍이 백 g2 비숍에서 흑 b7 폰 쪽으로 이어지는 공격선을 막습니다. 백 g2 비숍을 새로 공격합니다. d5 칸은 폰의 지원을 받지 못합니다. 아래는 엔진이 제시한 각 응수에서 남는 기능과 교환 비용입니다.
          - paragraph [ref=e556]:
            - text: 제시된 수순은
            - button "c6 · 위치 살펴보기" [ref=e557] [cursor=pointer]: c6
            - button "Nge4 · 위치 살펴보기" [ref=e558] [cursor=pointer]: Nge4
            - button "Nd5 · 위치 살펴보기" [ref=e559] [cursor=pointer]: Nd5
            - button "Qb2 · 위치 살펴보기" [ref=e560] [cursor=pointer]: Qb2
            - button "Nxc3 · 위치 살펴보기" [ref=e561] [cursor=pointer]: Nxc3
            - button "Nxc3 · 위치 살펴보기" [ref=e562] [cursor=pointer]: Nxc3
            - button "Rb8 · 위치 살펴보기" [ref=e563] [cursor=pointer]: Rb8
            - button "Rfb1 · 위치 살펴보기" [ref=e564] [cursor=pointer]: Rfb1
            - button "Bc2 · 위치 살펴보기" [ref=e565] [cursor=pointer]: Bc2
            - text: 입니다. 응수
            - button "Nge4 · 위치 살펴보기" [ref=e566] [cursor=pointer]: Nge4
            - text: — 상대는 나이트를 e4 칸으로 옮깁니다. 제시된
            - button "Bc2 · 위치 살펴보기" [ref=e567] [cursor=pointer]: Bc2
            - text: "이후의 배치에서는: d5 칸은 여전히 흑 c6 폰이 받칩니다. 원래 b3의 비숍은 c2에 남습니다. 백 a4 폰, 백 b1 룩, 백 d3 폰을 공격합니다. 원래 a8의 룩은 b8에 남습니다. 흑 b7 폰을 지킵니다. 원래 c7의 폰은 교환을 거쳐 c6에 남습니다. 현재 흑 b7 폰, 흑 d4 나이트가 지킵니다. 제시된"
            - button "c6 · 위치 살펴보기" [ref=e568] [cursor=pointer]: c6
            - text: 수순에서 양쪽이 나이트 한 개씩 교환합니다. 기록된 수순은
            - button "Bc2 · 위치 살펴보기" [ref=e569] [cursor=pointer]: Bc2
            - text: 이후에 끝나며, 그다음 응수는 기록되어 있지 않습니다.
          - paragraph [ref=e570]:
            - button "Bd5 · 위치 살펴보기" [ref=e571] [cursor=pointer]: Bd5
            - text: "수순에서: 이후"
